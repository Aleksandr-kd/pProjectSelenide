plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
}
ext {
    allureVersion = '2.24.0'
}


allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}

group = "maja"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}
/*
def selenideVersion = "6.19.1";
def junitJupiterVersion = "5.8.1";*/

dependencies {
    testImplementation(
            'com.codeborne:selenide:7.11.1',
            'org.junit.jupiter:junit-jupiter:6.0.0',
            "org.slf4j:slf4j-simple:2.0.17",
            'org.assertj:assertj-core:3.27.6',
            'com.codeborne:pdf-test:2.1.0',
            'com.codeborne:xls-test:1.4.3',
            'com.opencsv:opencsv:5.12.0',
            'com.fasterxml.jackson.core:jackson-databind:2.20.0',
            'io.qameta.allure:allure-selenide:2.30.0',
            "io.github.bonigarcia:webdrivermanager:6.3.2",
            'com.github.javafaker:javafaker:1.0.2')

    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.9.0')
}

