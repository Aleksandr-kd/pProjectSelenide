task run_tests(type: Test) {
    useJUnitPlatform {
        includeTags("JenkinsTest")

    }
}

tasks.withType(Test) {
    systemProperties(System.getProperties())
    useJUnitPlatform()
    jvmArgs = ['-ea', '-Xmx128m', '-XX:+HeapDumpOnOutOfMemoryError']


    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

task smoke_tests(type: Test) {
    useJUnitPlatform {
        includeTags("smoke")
    }
}

task one_property_test(type: Test) {
    useJUnitPlatform {
        includeTags("one_property")
    }
}

task hello_test(type: Test) {
    useJUnitPlatform {
        includeTags("hello")
    }
}

task two_test(type: Test) {
    useJUnitPlatform {
        includeTags("one_property")
        includeTags("hello")
    }
}

task tag_example_test(type: Test) {
    useJUnitPlatform {
        includeTags("needed", "negative")  // запускаем тесты "needed", "negative"
        excludeTags("prod")  //пропускаем тесты prod
    }
}